<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thymeleaf View Engine</title>
<link
	href="https:/cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<div class="container my-4">
		<div class="row">
			<div class="col-md-8 mx-auto rounded border p-4">
				<h2 class="text-center mb-5">Edit User</h2>
				<form th:action="@{/user/edit/save}" method="post" th:object="${user}" enctype="multipart/form-data">
					<div class="row mb-3">
						<label class="col-sm-4 col-form-label">ID</label>
						<input class="form-control" th:field="*{id}" type="text" readonly="readonly">
					</div>
					<div class="row mb-3">
						<div class="col-md-6">
							<label class="col-sm-4 col-form-label">User name<sup class="text-danger">(*)</sup></label>						
							<input class="form-control" th:field="*{username}" type="text" readonly="readonly">
									
						</div>
						<div class="col-md-6">
							<label class="col-sm-4 col-form-label">Password<sup class="text-danger">(*)</sup></label>						
							<input class="form-control" th:field="*{password}" type="password">
							<p th:if="${#fields.hasErrors('password')}"
								th:errors="*{password}"
								th:errorclass="text-danger">
							</p>						
						</div>
					</div>
					
					<div class="row mb-3">
						<div class="col-md-4">
							<label class="col-sm-4 col-form-label">First name<sup class="text-danger">(*)</sup></label>						
							<input class="form-control" th:field="*{firstname}" type="text">
							<p th:if="${#fields.hasErrors('firstname')}"
								th:errors="*{firstname}"
								th:errorclass="text-danger">
							</p>						
						</div>
						<div class="col-md-4">
							<label class="col-sm-4 col-form-label">Last name<sup class="text-danger">(*)</sup></label>						
							<input class="form-control" th:field="*{lastname}" type="text">
							<p th:if="${#fields.hasErrors('lastname')}"
								th:errors="*{lastname}"
								th:errorclass="text-danger">
							</p>						
						</div>
						<div class="col-md-4">
							<label class="col-sm-4 col-form-label">Date of birth<sup class="text-danger">(*)</sup></label>				
							<input class="form-control" th:field="*{dateOfBirth}" type="date">
							<p th:if="${#fields.hasErrors('dateOfBirth')}"
								th:errors="*{dateOfBirth}"
								th:errorclass="text-danger">
							</p>						
						</div>
					</div>
					
					<div class="row mb-3">
						<div class="col-md-6">
							<label class="col-sm-4 col-form-label">Gender<sup class="text-danger">(*)</sup></label>			
							<div class="form-check form-check-inline">
						        <input class="form-check-input"
						               type="radio"
						               th:field="*{gender}"
						               value="nam">
						        <label class="form-check-label">Nam</label>
						    </div>
						
						    <div class="form-check form-check-inline">
						        <input class="form-check-input"
						               type="radio"
						               th:field="*{gender}"
						               value="nu">
						        <label class="form-check-label">Nữ</label>
						    </div>
						
						    <div class="form-check form-check-inline">
						        <input class="form-check-input"
						               type="radio"
						               th:field="*{gender}"
						               value="khac">
						        <label class="form-check-label">Khác</label>
						    </div>
							<p th:if="${#fields.hasErrors('gender')}"
								th:errors="*{gender}"
								th:errorclass="text-danger">
							</p>						
						</div>
						<div class="col-md-6">
							<label class="col-sm-4 col-form-label">Email<sup class="text-danger">(*)</sup></label>
							<input class="form-control" th:field="*{email}" type="text">
							<p th:if="${#fields.hasErrors('email')}"
								th:errors="*{email}"
								th:errorclass="text-danger">
							</p>						
						</div>
					</div>
					
					<div class="row mb-3">
						<div class="col-md-6">
							<label class="col-sm-4 col-form-label">Phone<sup class="text-danger">(*)</sup></label>					
							<input class="form-control" th:field="*{mobile}" type="text">
							<p th:if="${#fields.hasErrors('mobile')}"
								th:errors="*{mobile}"
								th:errorclass="text-danger">
							</p>						
						</div>
						<div class="col-md-6">
							<label class="col-sm-4 col-form-label">Salary<sup class="text-danger">(*)</sup></label>					
							<input class="form-control" th:field="*{salary}" type="number">
							<p th:if="${#fields.hasErrors('salary')}"
								th:errors="*{salary}"
								th:errorclass="text-danger">
							</p>						
						</div>
					</div>
					
					<div class="row mb-3">
						<div class="col-md-6">
							<label class="col-sm-4 col-form-label">Create date<sup class="text-danger">(*)</sup></label>						
							<input class="form-control" th:field="*{createDate}" type="date" readonly="readonly">
							<p th:if="${#fields.hasErrors('createDate')}"
								th:errors="*{createDate}"
								th:errorclass="text-danger">
							</p>						
						</div>
						
						<div class="col-md-6">
							<label class="col-sm-4 col-form-label">Language<sup class="text-danger">(*)</sup></label>						
							<select class="form-select" th:field="*{language}">
								<option value="">-- Chọn ngôn ngữ --</option>
								<option th:each="lang : ${languages}" th:value="${lang}"
							            th:text="${lang}">
							    </option>
							</select>
							<p th:if="${#fields.hasErrors('language')}"
								th:errors="*{language}"
								th:errorclass="text-danger">
							</p>						
						</div>
					</div>
					
					<div class="row mb-3">
						<div class="col-md-2">
							<label class="form-label d-block">Status<sup class="text-danger">(*)</sup></label>	
							<div class="form-check">
								<input class="form-check-input" type="checkbox" th:field="*{status}">
								<label class="form-check-label">Active</label>
							</div>
												
						</div>
						<div class="col-md-10">
							<label class="form-label">Avatar</label>					
							<input name="avatarFile" class="form-control" type="file">
							<p th:if="${#fields.hasErrors('avatar')}"
								th:errors="*{avatar}"
								th:errorclass="text-danger">
							</p>						
						</div>
					</div>
					
					<div class="row justify-content-center mt-4">
						<div class="col-sm-4 d-grid">
							<button type="submit" class="btn-primary">Submit</button>
						</div>
						<div class="col-sm-4 d-grid">
							<a class="btn btn-outline-primary" th:href="@{/user}">Cancel</a>
						</div>
					</div>
					
				</form>
			</div>
		</div>
	</div>
</body>
</html>
