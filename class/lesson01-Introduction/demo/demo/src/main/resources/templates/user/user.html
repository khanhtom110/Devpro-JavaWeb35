<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thymeleaf View Engine</title>
<link
	href="https:/cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<div class="container-fluid">
		<h1 class="text-center mb-3">List of users</h1>
		<a class="btn btn-primary" th:href="@{/user/add}">New user</a>

		<table class="table">
			<thead>
				<tr>
					<th>No.</th>
					<th>ID</th>
					<th>Avatar</th>
					<th>Username</th>
					<th>Password</th>
					<th>First name</th>
					<th>Last name</th>
					<th>Date of birth</th>
					<th>Gender</th>
					<th>Email</th>
					<th>Phone</th>
					<th>Salary</th>
					<th>Create date</th>
					<th>Language</th>
					<th>Status</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="user, loop : ${users}">
					<td th:text="${loop.index + 1}"></td>
					<td th:text="${user.id}"></td>
					<td><img width="30" height="30" class="light-logo"
     						th:src="@{/UploadFiles/{path}(path=${user.avatar})}"></td>
     				<td th:text="${user.username}"></td>
     				<td th:text="${user.password}"></td>
					<td th:text="${user.firstname}"></td>
					<td th:text="${user.lastname}"></td>
					<td th:text="${#temporals.format(user.dateOfBirth, 'dd-MM-yyyy')}"></td>
					<td th:text="${user.gender}"></td>
					<td th:text="${user.email}"></td>
					<td th:text="${user.mobile}"></td>
					<td align="right"
						th:text="${user.salary != null ? 
								#numbers.formatDecimal(user.salary, 0, 'POINT', 0, 'COMMA') : '0.0'}">
					<td th:text="${#temporals.format(user.createDate, 'dd-MM-yyyy')}"></td>					
					<td th:text="${user.language}"></td>
					<td th:text="${user.status ? 'Active' : 'Inactive'}"></td>
					
					<td style="white-space:nowrap">
						<a class="btn btn-primary btn-sm"
							th:href="@{/user/edit(id=${user.id})}">Edit</a>
						<a class="btn btn-danger btn-sm"
							th:href="@{/user/delete(id=${user.id})}"
							onclick="return confirm('Are you sure?')">Delete</a>
					</td>
					
				</tr>
			
			</tbody>
		</table>
	</div>

	<script type="text/javascript"
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
