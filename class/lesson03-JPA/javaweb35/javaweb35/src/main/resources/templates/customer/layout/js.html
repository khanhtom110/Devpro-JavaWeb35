<div xmlns:th="http://www.thymeleaf.org" th:fragment="js">
	<!-- Jquery -->
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
	<!-- ScrollReveal -->
	<script th:src="@{/customer/js/scrollreveal.min.js}"></script>

	<script th:src="@{/customer/js/app.js}"></script>

	<script th:src="@{/customer/js/mobileMenu.js}"></script>

	<!-- Slider -->
	<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			new Swiper(".mySwiper", {
				loop : true,
				autoplay : {
					delay : 3000,
					disableOnInteraction : false,
				},
				navigation : {
					nextEl : ".swiper-button-next",
					prevEl : ".swiper-button-prev",
				}
			});
		});
	</script>

	<script>
		document.addEventListener('DOMContentLoaded', function() {
			new Swiper('.myProduct', {
				loop : true,
				pagination : {
					el : '.swiper-pagination',
					clickable : true
				},
				navigation : {
					nextEl : '.swiper-button-next',
					prevEl : '.swiper-button-prev'
				}
			});
		});
	</script>
</div>
