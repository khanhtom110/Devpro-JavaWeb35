<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="16x16"
	th:href="@{/customer/images/logo.jpg}">
	<title th:text="${title}">Trang khach hang</title>
	
	<!-- CSS -->
	<th:block th:insert="~{customer/layout/css :: css}"></th:block>
    
</head>

<body>
	<div class="wrapper">
		<!-- Header -->
        <div th:replace="~{customer/layout/header :: header}"></div>

		<!-- content -->
		<main class="main">

			<!-- Danh mục sản phẩm -->
			<div class="main__products">
				<div class="container" id="cartView">
					<div class="main__products-title">
						<p>GIỎ HÀNG CỦA BẠN</p>
					</div>
					
						<div th:if="${totalProducts > 0}">
							<form method="get">
								<div class="page-breadcrumb">

									<div class="row">

										<div class="col-12">
											<h3 align="center"
												class="page-title text-truncate text-dark font-weight-medium mb-1">
												<span id="placeOrderSuccess" th:text="'Your cart: ' + ${message}">
												</span>
											</h3>
										</div>

									</div>

									<div class="row">
										<div class="col-12">
											<div class="card">
												<div class="card-body">
													<div class="row">

														<div class="col-12">
															<table id="zero_config"
																class="table table-striped table-bordered no-wrap">
																<thead>
																	<tr>
																		<th scope="col" class="text-center">No.</th>
																		<th scope="col" class="text-center">Image</th>
																		<th scope="col" class="text-center">Product</th>
																		<th scope="col" class="text-center">Quantity</th>
																		<th scope="col" class="text-center">Price</th>
																		<th scope="col" class="text-center">Total</th>
																		<th scope="col" class="text-center">Actions</th>
																	</tr>
																</thead>
																<tbody>
																		<tr th:each="cartProduct, loop : ${cart.items}">
																			<th scope="row" th:text="${loop.index + 1}"></th>
																			<td><img width="40px" height="40px"
																				th:src="${cartProduct.avatar} != null ?
																						@{/UploadFiles/{path}(path=${cartProduct.avatar})} :
																						@{/customer/img/no-image.png}" class="light-logo">
																			</td>
																			<td th:text="${cartProduct.name}"></td>
																			<td align="center"> <!-- 
																				<button type="button" class="btn btn-secondary"
																					th:data-id="${cartProduct.id}"
																					th:onclick="updateProductQuantity(this.dataset.id, -1)">
																					<i class='bx bx-down-arrow-alt'></i>
																				</button> 
																					<strong><span
																						th:id="'productQuantity_' + ${cartProduct.id}" 
																						th:text="${cartProduct.quantity}"></span>
																					</strong>
																				<button type="button" class="btn btn-secondary"
																					th:data-id="${cartProduct.id}"
																					th:onclick="updateProductQuantity(this.dataset.id, 1)">
																					<i class='bx bx-up-arrow-alt'></i>
																				</button>
																				 -->
																				<div class="quantity__plus mb-2">
                                                    								<input type="number" name="quantity" id="quantity" min="1" 
                                                    									th:value="${cartProduct.quantity}"
                                                    									class="form-control form-control-sm" style="width: 70px;"
                                                    									th:onchange="|updateProductQuantity(${cartProduct.id}, this.value)|">
                                                								</div>
																			</td>
																			<td align="right"
																				th:text="${#numbers.formatDecimal(cartProduct.price, 0, 'COMMA', 0, 'POINT')}">
																			</td>
																			<td align="right">
																				<span th:id = "'totalPrice_' + ${cartProduct.id}"
																					th:text="${#numbers.formatDecimal(cartProduct.price * cartProduct.quantity, 0, 'COMMA', 0, 'POINT')}">
																				</span>
																			</td>
																			<td align="center"><a
																				th:href="@{/product(id=${cartProduct.id})}"
																				role="button" class="btn btn-primary">Edit</a> <a
																				th:href="@{/product-cart-delete(id=${cartProduct.id})}"
																				role="button" class="btn btn-secondary">Delete</a>
																			</td>
																		</tr>
																</tbody>

															</table>
														</div>

													</div>

													<div class="row">
														<div class="col-4">
															<h4
																class="page-title text-truncate text-dark font-weight-medium mb-1">
																Grand Total:
																<strong><span
																		th:id="'totalCartPriceId'"
																		th:text="${#numbers.formatDecimal(totalCartPrice, 0, 'COMMA', 0, 'POINT')}">
																</span></strong>
																<sup>đ</sup>
																
															</h4>
														</div>

													</div>

												</div>
											</div>
										</div>
									</div>
								</div>
							</form>
							<!-- Thong tin khach hang -->
							<div class="page-breadcrumb">
								<div class="row"></div>
								<div class="row">
									<div class="main__products-title">
										<p>Thông tin khách hàng</p>
									</div>
								</div>
								<!-- form action="${classpath }/cart-view" method="get">-->
									<div class="row">

										<div class="col-12">
											<div class="card">
												<div class="card-body">
													<div class="form-body">
														<div class="row">

															<div class="col-md-12">
																<div class="form-group mb-4">
																	<label for="name">Customer name (*)</label> 
																	<input
																		type="text" class="form-control" id="txtName"
																		name="txtName" placeholder="your name"
																		th:value="${loginedUser.lastname}" />
																</div>
															</div>
														</div>

														<div class="row">

															<div class="col-md-12">
																<div class="form-group mb-4">
																	<label for="mobile">Customer mobile (*)</label> 
																	<input
																		type="text" class="form-control" id="txtMobile"
																		name="txtMobile" placeholder="your phone number"
																		th:value="${loginedUser.mobile}" />
																</div>
															</div>
														</div>

														<div class="row">

															<div class="col-md-12">
																<div class="form-group mb-4">
																	<label for="phone">Customer email</label> 
																	<input
																		type="email" class="form-control" id="txtEmail"
																		name="txtEmail" placeholder="your email"
																		th:value="${loginedUser.email}" />
																</div>
															</div>
														</div>

														<div class="row">

															<div class="col-md-12">
																<div class="form-group mb-4">
																	<label for="phone">Customer address</label> 
																	<input
																		type="text" class="form-control" id="txtAddress"
																		name="txtAddress" placeholder="your address"
																		th:value="${loginedUser.address}" />
																</div>
															</div>
														</div>
														<div class="row">
															<div class="col-md-12">
																<div class="form-group mb-4">
																	<a th:href="@{/index}"
																		class="btn btn-primary active" role="button"
																		aria-pressed="true"> Back to shop </a>
																	<button class="btn btn-primary active" th:onclick="checkout()">
																	Checkout</button>

																</div>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>

									</div>
								<!-- /form>-->
							</div>
						</div> <!-- if totalProducts > 0 -->
						<div th:unless="${totalProducts > 0}">
							<div class="row">
								<div class="col-12">
									
										<div th:if="${checkout}">
											<h3 align="center"
												class="page-title text-truncate text-dark font-weight-medium mb-1">
												<span id="placeOrderSuccess">Bạn đã đặt hàng thành công</span>
											</h3>
										</div>
										<div th:unless="${checkout}">
											<h3 align="center"
												class="page-title text-truncate text-dark font-weight-medium mb-1"
												th:text="'Your cart: ' + ${message}">
											</h3>
										</div>>
									

								</div>
							</div>
							<div class="row">
								<div class="col-md-12" align="center">
									<div class="form-group mb-4">
										<a th:href="@{/index}" class="btn btn-primary active"
											role="button" aria-pressed="true"> Back to shop </a>
									</div>
								</div>
							</div>

						</div>>
					
				</div>
			</div>

		</main>

		<!-- footer -->
		<div th:replace="~{customer/layout/footer :: footer}"></div>

		<div class="scroll__top">
			<i class='bx bx-up-arrow-alt'></i>
		</div>

		<!-- mobile menu -->
		<div th:replace="~{customer/layout/mobilemenu :: mobilemenu}"></div>
	</div>
	<!-- js -->
	<div th:replace="~{customer/layout/js :: js}"></div>

	<script th:inline="javascript">
	
		function formatCurrency(value) {
		    return Number(value).toLocaleString('en-US');
		}
	
		function updateProductQuantity (productId, quantity) {

			fetch('/cart/update-quantity?productId=' + productId + 
					'&quantity=' + quantity, {method: 'POST'})
			.then(res => res.json())
			.then(data => {
				if (data.success) {
					//document.getElementById("productQuantity_" + data.productId).innerText = data.newQuantity;
					document.getElementById("totalCartPriceId").innerText = 
							formatCurrency(data.totalCartPrice);
					document.getElementById("totalPrice_" + data.productId).innerText = 
							formatCurrency(data.totalPrice);
					document.getElementById("totalProducts").innerText = 
							data.totalProducts;
				}
			})
			.catch(err => {
				//console.error(err);
				alert("Có lỗi khi cập nhật số lượng");
			});
		}
	</script>

	<script type="text/javascript">
		function checkout() {
			const name = document.getElementById("txtName").value;
			const email = document.getElementById("txtEmail").value;
			const mobile = document.getElementById("txtMobile").value;
			const address = document.getElementById("txtAddress").value;
			
			fetch('/cart/checkout?name=' + name + '&email=' + email + 
					'&mobile=' + mobile + '&address=' + address, {
		        method: 'POST'
		    })
		    
		    .then(res => res.json())
		    .then(data => {
		        alert(data.message);
		    })
		    
		    .catch(err => {
				//console.error(err);
				alert(message);
			});
		}
	</script>

</body>
</html>
