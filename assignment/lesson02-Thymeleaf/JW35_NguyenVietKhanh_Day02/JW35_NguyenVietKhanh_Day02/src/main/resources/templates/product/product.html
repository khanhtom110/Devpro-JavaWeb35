<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thymeleaf View Engine</title>
<link
	href="https:/cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<div class="container-fluid">
		<h1 class="text-center mb-3">List of products</h1>
		<a class="btn btn-primary" th:href="@{/product/add}">New product</a>

		<table class="table">
			<thead>
				<tr>
					<th>No.</th>
					<th>ID</th>
					<th>Image</th>
					<th>Name</th>
					<th>Weight</th>
					<th>Quantity</th>
					<th>Price</th>
					<th>Manufacture Date</th>
					<th>Expiry Date</th>
					<th>Color</th>
					<th>Status</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="product, loop : ${products}">
					<td th:text="${loop.index + 1}"></td>
					<td th:text="${product.id}"></td>
					<td><img width="30" height="30" class="light-logo"
     						th:src="@{/UploadFiles/{path}(path=${product.image})}"></td>
     				<td th:text="${product.name}"></td>
     				<td th:text="${product.weight}"></td>
					<td th:text="${product.quantity}"></td>
					<td align="right"
						th:text="${product.price != null ? 
								#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA') : '0.0'}">
					<td th:text="${#temporals.format(product.manufactureDate, 'dd-MM-yyyy')}"></td>
					<td th:text="${#temporals.format(product.expiryDate, 'dd-MM-yyyy')}"></td>
					<td th:text="${product.color}"></td>
					<td th:text="${product.status ? 'Active' : 'Inactive'}"></td>
					<td style="white-space:nowrap">
						<a class="btn btn-primary btn-sm"
							th:href="@{/product/edit(id=${product.id})}">Edit</a>
						<a class="btn btn-danger btn-sm"
							th:href="@{/product/delete(id=${product.id})}"
							onclick="return confirm('Are you sure?')">Delete</a>
					</td>
					
				</tr>
			
			</tbody>
		</table>
	</div>

	<script type="text/javascript"
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
