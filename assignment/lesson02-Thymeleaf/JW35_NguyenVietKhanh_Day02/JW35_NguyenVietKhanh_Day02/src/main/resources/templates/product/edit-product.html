<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thymeleaf View Engine</title>
<link
	href="https:/cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<div class="container my-4">
		<div class="row">
			<div class="col-md-8 mx-auto rounded border p-4">
				<h2 class="text-center mb-5">Update Product</h2>
				<form th:action="@{/product/edit/save}" method="post"
					th:object="${product}" enctype="multipart/form-data">
	
					<div class="row mb-3">
						<div class="col-md-12">
							<label class="col-sm-4 col-form-label">ID</label> <input
								class="form-control" th:field="*{id}" type="text"
								readonly="readonly">
						</div>
					</div>
					<div class="row mb-3">
						<div clas="col-md-12">
							<label class="col-sm-4 col-form-label">Product's name<sup
								class="text-danger">(*)</sup></label> <input class="form-control"
								th:field="*{name}" type="text">
							<p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
								th:errorclass="text-danger"></p>
						</div>
					</div>

					<div class="row mb-3">
						<div class="col-md-4">
							<label class="col-sm-4 col-form-label">Weight<sup
								class="text-danger">(*)</sup></label> <select class="form-select"
								th:field="*{weight}">
								<option value="">-- Select weight --</option>
								<option th:each="w : ${weights}" th:value="${w}"
									th:text="${w + 'g'}"></option>
							</select>
							<p th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}"
								th:errorclass="text-danger"></p>
						</div>

						<div class="col-md-4">
							<label class="col-sm-4 col-form-label">Quantity<sup
								class="text-danger">(*)</sup></label> <input class="form-control"
								th:field="*{quantity}" type="number">
							<p th:if="${#fields.hasErrors('quantity')}"
								th:errors="*{quantity}" th:errorclass="text-danger"></p>
						</div>
						<div class="col-md-4">
							<label class="col-sm-4 col-form-label">Price<sup
								class="text-danger">(*)</sup></label> <input class="form-control"
								th:field="*{price}" type="number" step="any">
							<p th:if="${#fields.hasErrors('price')}" th:errors="*{price}"
								th:errorclass="text-danger"></p>
						</div>
					</div>





					<div class="row mb-3">
						<div class="col-md-6">
							<label class="form-label">Manufacture date<sup
								class="text-danger">(*)</sup></label> <input class="form-control"
								th:field="*{manufactureDate}" type="date">
							<p th:if="${#fields.hasErrors('manufactureDate')}"
								th:errors="*{manufactureDate}" th:errorclass="text-danger">
							</p>
						</div>

						<div class="col-md-6">
							<label class="form-label">Expiry date<sup
								class="text-danger">(*)</sup></label> <input class="form-control"
								th:field="*{expiryDate}" type="date">
							<p th:if="${#fields.hasErrors('expiryDate')}"
								th:errors="*{expiryDate}" th:errorclass="text-danger"></p>
						</div>
					</div>

					<div class="row mb-3">
						<div class="col-md-8">
							<div class="d-flex justify-content-between align-items-center">
								<label class="form-label">Color<sup class="text-danger">(*)</sup></label>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio"
										th:field="*{color}" value="Red"> <label
										class="form-check-label">Red</label>
								</div>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio"
										th:field="*{color}" value="Blue"> <label
										class="form-check-label">Blue</label>
								</div>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio"
										th:field="*{color}" value="Green"> <label
										class="form-check-label">Green</label>
								</div>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio"
										th:field="*{color}" value="White"> <label
										class="form-check-label">White</label>
								</div>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio"
										th:field="*{color}" value="Yellow"> <label
										class="form-check-label">Yellow</label>
								</div>
							</div>
							<p th:if="${#fields.hasErrors('color')}" th:errors="*{color}"
								th:errorclass="text-danger"></p>
						</div>
						<div class="col-md-4">
							<label class="form-label d-block">Status<sup
								class="text-danger">(*)</sup></label>
							<div class="form-check">
								<input class="form-check-input" type="checkbox"
									th:field="*{status}"> <label class="form-check-label">Active</label>
							</div>

						</div>
					</div>


					<div class="row mb-3">
						<div class="col-md-12">
							<label class="form-label">Product's image</label> <input
								name="productImageFile" class="form-control" type="file">
							<p th:if="${#fields.hasErrors('image')}" th:errors="*{image}"
								th:errorclass="text-danger"></p>
						</div>
					</div>



					<div class="row justify-content-center mt-4">
						<div class="col-sm-4 d-grid">
							<button type="submit" class="btn-primary">Submit</button>
						</div>
						<div class="col-sm-4 d-grid">
							<a class="btn btn-outline-primary" th:href="@{/product}">Cancel</a>
						</div>
					</div>

				</form>
			</div>
		</div>
	</div>
</body>
</html>
