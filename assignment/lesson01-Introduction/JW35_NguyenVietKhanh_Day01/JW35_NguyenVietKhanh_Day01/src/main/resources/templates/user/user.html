<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thymeleaf View Engine</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<div class="container-fluid">
		<h1 class="text-center mb-3">List of users</h1>
		<!-- <a class="btn btn-primary" th:href="@{/user/add}">New user</a> -->

		<table class="table">
			<thead>
				<tr>
					<th>No.</th>
					<th>ID</th>
					<th>First name</th>
					<th>Last name</th>
					<th>Phone</th>
					<th>Address</th>
					<th>Email</th>
					<th>Gender</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="user, loop : ${users}">
					<td th:text="${loop.index + 1}"></td>
					<td th:text="${user.id}"></td>
					<td th:text="${user.firstName}"></td>
					<td th:text="${user.lastName}"></td>
					<td th:text="${user.phone}"></td>
					<td th:text="${user.address}"></td>
					<td th:text="${user.email}"></td>
					<td th:text="${user.gender}"></td>

					<td style="white-space: nowrap"><a
						class="btn btn-primary btn-sm"
						th:href="@{/user/edit(id=${user.id})}">Edit</a> <a
						class="btn btn-danger btn-sm"
						th:href="@{/user/delete(id=${user.id})}"
						onclick="return confirm('Are you sure?')">Delete</a></td>

				</tr>

			</tbody>
		</table>
	</div>

	<script type="text/javascript"
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
